name: MCLink
version: 1.0.0
main: ru.mclink.plugin.MCLinkPlugin
api-version: 1.20
description: Привязка аккаунтов VK/Telegram к Minecraft
author: MCLink

commands:
  link:
    description: Привязать аккаунт VK или Telegram
    usage: /link
    aliases: [линк]
  linkstatus:
    description: Проверить статус привязки
    usage: /linkstatus
    aliases: [линкстатус]
  linkunlink:
    description: Отвязать аккаунт (только для игрока на сервере)
    usage: /linkunlink

permissions:
  mclink.use:
    description: Использовать команды привязки
    default: true
  mclink.admin:
    description: Административные команды
    default: op
